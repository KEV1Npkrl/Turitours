<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin Login - Sistema Estándar de Gestión Turística</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .superadmin-bg {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: var(--muted-foreground);
            font-size: 0.875rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #334155;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: all var(--transition);
        }
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-superadmin {
            background-color: #0f172a;
            color: white;
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
        }
        .btn-superadmin:hover {
            background-color: #1e293b;
        }
        .error-message {
            color: var(--destructive);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
            text-align: center;
        }
        .badge-sa {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="superadmin-bg">

    <div class="login-card">
        <div class="login-header">
            <span class="badge-sa">Panel Global</span>
            <h1>SuperAdministrador</h1>
            <p>Acceso seguro a la gestión del sistema</p>
        </div>

        <form id="saLoginForm">
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" class="form-input" placeholder="admin@superadmin.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-superadmin">
                Ingresar al Sistema
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
            <div id="loginError" class="error-message">Credenciales incorrectas.</div>
        </form>
    </div>

    <script src="../js/data.js"></script>
    <script>
        document.getElementById('saLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const db = getMockDb();
            
            const admin = db.super_usuarios.find(u => u.email === email && u.password === password && u.activo === 1);
            
            if (admin) {
                localStorage.setItem('sa_user', JSON.stringify({id: admin.id, nombre: admin.nombre}));
                
                // Auditar login
                db.auditoria_global.push({
                    id: db.auditoria_global.length + 1,
                    super_usuario_id: admin.id,
                    accion: 'LOGIN',
                    detalles: 'Inicio de sesión exitoso',
                    ip: 'Localhost',
                    created_at: new Date().toISOString()
                });
                saveMockDb(db);
                
                window.location.href = 'index.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>
</html>
