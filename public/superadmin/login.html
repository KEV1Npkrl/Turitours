<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin Login - Sistema Estándar de Gestión Turística</title>
    <link rel="stylesheet" href="../css/styles.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .superadmin-bg {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        @media (max-height: 600px) {
            .superadmin-bg {
                align-items: flex-start;
                padding-top: 2rem;
                padding-bottom: 2rem;
                overflow-y: auto;
            }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: var(--muted-foreground);
            font-size: 0.875rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #334155;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: all var(--transition);
        }
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-superadmin {
            background-color: #0f172a;
            color: white;
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
        }
        .btn-superadmin:hover {
            background-color: #1e293b;
        }
        .error-message {
            color: var(--destructive);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
            text-align: center;
        }
        .badge-sa {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
    </style>
    <link rel="stylesheet" href="../css/responsive.css?v=3">

<style id="responsive-inline">
/* ===== RESPONSIVE INLINE — SUPERADMIN ===== */
@media (max-width: 1023px) {
    .sa-sidebar {
        transform: translateX(-100%) !important;
        transition: transform 0.3s ease !important;
    }
    .sa-sidebar.open {
        transform: translateX(0) !important;
    }
    .sa-main {
        margin-left: 0 !important;
    }
}
@media (max-width: 768px) {
    .sa-sidebar {
        width: 260px !important;
        position: fixed !important;
        z-index: 1000 !important;
        transform: translateX(-100%) !important;
        transition: transform 0.3s ease !important;
    }
    .sa-sidebar.open {
        transform: translateX(0) !important;
    }
    .sa-main {
        margin-left: 0 !important;
        width: 100% !important;
    }
    .sa-header {
        padding: 0 0.75rem !important;
        gap: 0.5rem;
        justify-content: flex-start !important;
    }
    .sa-header h2 {
        font-size: 1rem !important;
        flex: 1;
    }
    .sa-user {
        gap: 0.5rem !important;
    }
    #saUserName {
        display: none !important;
    }
    .sa-content {
        padding: 0.75rem !important;
    }
    .stats-grid {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .panel-card {
        padding: 1rem !important;
        margin-bottom: 1rem !important;
    }
    .panel-header {
        flex-direction: column !important;
        gap: 0.75rem;
        align-items: flex-start !important;
    }
    .panel-title {
        font-size: 1.1rem !important;
    }
    .table-responsive {
        width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
    }
    .table-sa {
        min-width: 500px;
    }
    .table-sa th,
    .table-sa td {
        padding: 0.5rem 0.75rem !important;
        font-size: 0.8125rem !important;
        white-space: nowrap;
    }
    .form-grid {
        grid-template-columns: 1fr !important;
    }
    .filters {
        flex-direction: column !important;
        gap: 0.5rem !important;
    }
    .modal-content {
        width: 95vw !important;
        max-width: 95vw !important;
        padding: 1rem !important;
        margin: 0.5rem !important;
    }
    .ticket-grid {
        grid-template-columns: 1fr !important;
    }
    .mobile-toggle {
        display: block !important;
        background: none !important;
        border: none !important;
        font-size: 1.5rem !important;
        cursor: pointer;
        margin-right: 0.75rem;
        color: #0f172a;
        padding: 4px;
        line-height: 1;
    }
}
.sa-sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 999;
}
.sa-sidebar-overlay.open {
    display: block;
}
@media (min-width: 769px) {
    .mobile-toggle {
        display: none !important;
    }
}
@media (max-width: 480px) {
    .sa-content {
        padding: 0.5rem !important;
    }
    .panel-card {
        padding: 0.75rem !important;
    }
    .stat-info .value {
        font-size: 1.5rem !important;
    }
}
</style>

</head>
<body class="superadmin-bg">

    <div class="login-card">
        <div class="login-header">
            <span class="badge-sa">Panel Global</span>
            <h1>SuperAdministrador</h1>
            <p>Acceso seguro a la gestión del sistema</p>
        </div>

        <form id="saLoginForm">
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" class="form-input" placeholder="admin@superadmin.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-superadmin">
                Ingresar al Sistema
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
            <div id="loginError" class="error-message">Credenciales incorrectas.</div>
        </form>
    </div>

    <script src="../js/data.js"></script>
    <script>
        document.getElementById('saLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = this.querySelector('button[type="submit"]');
            
            btn.disabled = true;
            btn.innerHTML = 'Ingresando...';

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }

                // Asegurarse de que sea superadmin (rol_id 99 que pusimos en Java)
                if (data.user.rol_id !== 99) {
                    throw new Error('No tienes permisos de Superadministrador.');
                }

                localStorage.setItem('sa_user', JSON.stringify({id: data.user.id, nombre: data.user.nombre, token: data.token}));
                window.location.href = 'index.html';
            } catch (err) {
                const errorEl = document.getElementById('loginError');
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                
                btn.disabled = false;
                btn.innerHTML = `Ingresar al Sistema
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>`;
            }
        });
    </script>
    <script src="../js/responsive.js"></script>
</body>
</html>
