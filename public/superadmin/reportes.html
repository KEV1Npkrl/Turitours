<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Sectoriales - SuperAdmin</title>
    <link rel="stylesheet" href="../css/styles.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sa-sidebar: #1e293b;
            --sa-hover: #334155;
            --sa-accent: #3b82f6;
        }
        body { background-color: #f1f5f9; display: flex; min-height: 100vh; margin: 0; }
        .sa-sidebar { width: 260px; background-color: var(--sa-sidebar); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 10; }
        .sa-brand { padding: 1.5rem; font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sa-nav { padding: 1rem 0; flex: 1; }
        .sa-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1.5rem; color: #cbd5e1; transition: all var(--transition); }
        .sa-nav-item:hover, .sa-nav-item.active { background-color: var(--sa-hover); color: white; border-left: 4px solid var(--sa-accent); }
        .sa-main { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
        .sa-header { background-color: white; height: 4rem; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
        .sa-user { display: flex; align-items: center; gap: 1rem; font-weight: 500; }
        .btn-logout { color: var(--destructive); font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 0.25rem; }
        .sa-content { padding: 2rem; }
        
        .panel-card { background: white; border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 2rem; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .panel-title { font-size: 1.25rem; font-weight: 600; }
        
        /* Bar Chart CSS */
        .chart-container { margin-top: 1rem; }
        .bar-item { margin-bottom: 1rem; }
        .bar-label { display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 0.25rem; font-weight: 500; }
        .bar-track { width: 100%; height: 1rem; background-color: var(--muted); border-radius: 999px; overflow: hidden; }
        .bar-fill { height: 100%; background-color: var(--sa-accent); border-radius: 999px; transition: width 1s ease-out; }
        .bar-fill.green { background-color: var(--success); }
        
        .filters { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .form-select { padding: 0.5rem; border: 1px solid var(--border); border-radius: var(--radius); outline: none; }
    </style>
    <link rel="stylesheet" href="../css/responsive.css?v=3">

<style id="responsive-inline">
/* ===== RESPONSIVE INLINE — SUPERADMIN ===== */
@media (max-width: 1023px) {
    .sa-sidebar {
        transform: translateX(-100%) !important;
        transition: transform 0.3s ease !important;
    }
    .sa-sidebar.open {
        transform: translateX(0) !important;
    }
    .sa-main {
        margin-left: 0 !important;
    }
}
@media (max-width: 768px) {
    .sa-sidebar {
        width: 260px !important;
        position: fixed !important;
        z-index: 1000 !important;
        transform: translateX(-100%) !important;
        transition: transform 0.3s ease !important;
    }
    .sa-sidebar.open {
        transform: translateX(0) !important;
    }
    .sa-main {
        margin-left: 0 !important;
        width: 100% !important;
    }
    .sa-header {
        padding: 0 0.75rem !important;
        gap: 0.5rem;
        justify-content: flex-start !important;
    }
    .sa-header h2 {
        font-size: 1rem !important;
        flex: 1;
    }
    .sa-user {
        gap: 0.5rem !important;
    }
    #saUserName {
        display: none !important;
    }
    .sa-content {
        padding: 0.75rem !important;
    }
    .stats-grid {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .panel-card {
        padding: 1rem !important;
        margin-bottom: 1rem !important;
    }
    .panel-header {
        flex-direction: column !important;
        gap: 0.75rem;
        align-items: flex-start !important;
    }
    .panel-title {
        font-size: 1.1rem !important;
    }
    .table-responsive {
        width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
    }
    .table-sa {
        min-width: 500px;
    }
    .table-sa th,
    .table-sa td {
        padding: 0.5rem 0.75rem !important;
        font-size: 0.8125rem !important;
        white-space: nowrap;
    }
    .form-grid {
        grid-template-columns: 1fr !important;
    }
    .filters {
        flex-direction: column !important;
        gap: 0.5rem !important;
    }
    .modal-content {
        width: 95vw !important;
        max-width: 95vw !important;
        padding: 1rem !important;
        margin: 0.5rem !important;
    }
    .ticket-grid {
        grid-template-columns: 1fr !important;
    }
    .mobile-toggle {
        display: block !important;
        background: none !important;
        border: none !important;
        font-size: 1.5rem !important;
        cursor: pointer;
        margin-right: 0.75rem;
        color: #0f172a;
        padding: 4px;
        line-height: 1;
    }
}
.sa-sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 999;
}
.sa-sidebar-overlay.open {
    display: block;
}
@media (min-width: 769px) {
    .mobile-toggle {
        display: none !important;
    }
}
@media (max-width: 480px) {
    .sa-content {
        padding: 0.5rem !important;
    }
    .panel-card {
        padding: 0.75rem !important;
    }
    .stat-info .value {
        font-size: 1.5rem !important;
    }
}
</style>

</head>

    <main class="sa-main">
        <header class="sa-header">
            <h2 style="font-size: 1.25rem; font-weight: 600;">Reportes Sectoriales (DIRCETUR)</h2>
            <div class="sa-user">
                <span id="saUserName">SuperAdmin</span>
                <button id="btnLogout" class="btn-logout">Salir</button>
            </div>
        </header>

        <div class="sa-content">
            <div class="filters">
                <select class="form-select">
                    <option>Año 2026</option>
                    <option>Año 2025</option>
                </select>
                <select class="form-select">
                    <option>Todos los Meses</option>
                    <option>Enero - Junio</option>
                </select>
                <button class="btn btn-outline" style="margin-left: auto;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Exportar PDF
                </button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div class="panel-card">
                    <div class="panel-header">
                        <h3 class="panel-title">Tours Más Populares</h3>
                    </div>
                    <div class="chart-container" id="toursChart">
                        <!-- JS populated -->
                    </div>
                </div>

                <div class="panel-card">
                    <div class="panel-header">
                        <h3 class="panel-title">Ingresos Consolidados por Agencia</h3>
                    </div>
                    <div class="chart-container" id="ingresosChart">
                        <!-- JS populated -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/data.js"></script>
    <script>
        const saUser = JSON.parse(localStorage.getItem('sa_user'));
        if (!saUser) window.location.href = 'login.html';
        document.getElementById('saUserName').textContent = saUser.nombre;
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('sa_user'); window.location.href = 'login.html';
        });

        const db = getMockDb();

        // 1. Tours más populares
        const toursChart = document.getElementById('toursChart');
        const toursReservados = db.reservas.reduce((acc, r) => {
            acc[r.tour_id] = (acc[r.tour_id] || 0) + r.num_personas;
            return acc;
        }, {});
        
        const topTours = Object.entries(toursReservados)
            .sort((a,b) => b[1] - a[1])
            .map(t => {
                const tourInfo = db.tours.find(x => x.id === parseInt(t[0]));
                return { nombre: tourInfo ? tourInfo.nombre : 'Tour', pax: t[1] };
            });

        const maxPax = Math.max(...topTours.map(t => t.pax), 1);

        topTours.slice(0, 5).forEach(t => {
            const pct = (t.pax / maxPax) * 100;
            toursChart.innerHTML += `
                <div class="bar-item">
                    <div class="bar-label"><span>${t.nombre}</span> <span>${t.pax} pax</span></div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${pct}%"></div>
                    </div>
                </div>
            `;
        });

        // 2. Ingresos por Agencia
        const ingresosChart = document.getElementById('ingresosChart');
        const ingresosAgencia = db.reservas.reduce((acc, r) => {
            acc[r.agencia_id] = (acc[r.agencia_id] || 0) + r.total;
            return acc;
        }, {});

        const topAgencias = Object.entries(ingresosAgencia)
            .sort((a,b) => b[1] - a[1])
            .map(a => {
                const agInfo = db.agencias.find(x => x.id === parseInt(a[0]));
                return { nombre: agInfo ? agInfo.nombre : 'Agencia', total: a[1] };
            });

        const maxIngreso = Math.max(...topAgencias.map(a => a.total), 1);

        topAgencias.slice(0, 5).forEach(a => {
            const pct = (a.total / maxIngreso) * 100;
            ingresosChart.innerHTML += `
                <div class="bar-item">
                    <div class="bar-label"><span>${a.nombre}</span> <span>S/ ${a.total.toFixed(2)}</span></div>
                    <div class="bar-track">
                        <div class="bar-fill green" style="width: ${pct}%"></div>
                    </div>
                </div>
            `;
        });
    </script>
    <script src="../js/responsive.js"></script>
</body>
