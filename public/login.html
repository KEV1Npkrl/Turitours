<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Tarapoto Tours</title>
    <meta name="description" content="Accede a tu cuenta de turista en Tarapoto Tours">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo"><span>Tarapoto Tours</span></a>
            <nav class="nav-desktop">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="tours.html" class="nav-link">Tours</a>
                <a href="destinos.html" class="nav-link">Destinos</a>
                <a href="nosotros.html" class="nav-link">Nosotros</a>
                <a href="contacto.html" class="nav-link">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 520px;">
            <div class="card" style="padding: 2rem;">
                <h1 class="section-title" style="margin-bottom: 1rem;">Iniciar Sesion</h1>
                <p style="margin-bottom: 1.5rem; color: var(--muted-foreground);">Accede para reservar tours y ver tus reservas.</p>
                <p style="margin-bottom: 1rem; font-size: 0.875rem; color: var(--muted-foreground);">Demo: kevin@example.com / demo1234</p>
                <form id="loginForm">
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label for="email">Correo</label>
                        <input type="email" id="email" name="email" class="filter-select" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label for="password">Contrasena</label>
                        <input type="password" id="password" name="password" class="filter-select" placeholder="Tu contrasena" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                </form>
                <p style="margin-top: 1rem;">¿No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/schema.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
