<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Turi Tours</title>
    <meta name="description" content="Crea tu cuenta de turista en Turi Tours">
    <link rel="stylesheet" href="../css/styles.css?v=4">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <header class="header header-auth">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <img src="../assets/turitours_logo.webp" alt="Turi Tours" class="logo-img" width="160" height="48">
            </a>
            <a href="login.html" class="btn btn-outline btn-sm auth-header-link">Iniciar sesion</a>
        </div>
    </header>

    <main class="auth-page auth-page-register">
        <div class="auth-card auth-card-wide">
            <div class="auth-header">
                <h1>Crea tu cuenta</h1>
                <p>Registrate como turista para reservar tours y acceder a tus vouchers.</p>
                <p class="auth-required-hint">Los campos marcados con <span class="label-required" aria-hidden="true">*</span> son obligatorios.</p>
            </div>

            <form id="registroForm" class="auth-form" autocomplete="on" novalidate>
                <div class="auth-form-grid">
                    <div class="form-group">
                        <label for="tipo_doc">Tipo de documento <span class="label-required" aria-hidden="true">*</span></label>
                        <select id="tipo_doc" name="tipo_doc" class="form-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="DNI">DNI - Documento Nacional de Identidad</option>
                            <option value="RUC">RUC - Registro Único de Contribuyente</option>
                            <option value="CE">CE - Carné de Extranjería</option>
                            <option value="Pasaporte">Pasaporte - Internacional</option>
                            <option value="OtroDoc">Otro Documento (emergencia)</option>
                        </select>
                        <span class="field-hint" id="tipoDocHint" style="font-size:0.75rem;color:var(--color-text-light);margin-top:0.25rem;"></span>
                    </div>
                    <div class="form-group">
                        <label for="documento">Numero de documento <span class="label-required" aria-hidden="true">*</span></label>
                        <input type="text" id="documento" name="documento" class="form-input" placeholder="12345678" autocomplete="off" maxlength="20" required>
                        <span class="field-hint" id="documentoHint"></span>
                        <span class="field-error" id="documentoError" role="alert"></span>
                    </div>
                </div>

                <div class="auth-form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombres <span class="label-required" aria-hidden="true">*</span></label>
                        <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Tu nombre" autocomplete="given-name" maxlength="60" required>
                        <span class="field-error" id="nombreError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="apellidos">Apellidos <span class="label-required" aria-hidden="true">*</span></label>
                        <input type="text" id="apellidos" name="apellidos" class="form-input" placeholder="Tus apellidos" autocomplete="family-name" maxlength="80" required>
                        <span class="field-error" id="apellidosError" role="alert"></span>
                    </div>
                </div>

                <div class="auth-form-grid">
                    <div class="form-group">
                        <label for="email">Correo electronico</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com" autocomplete="email" inputmode="email" spellcheck="false" maxlength="120">
                        <span class="field-error" id="emailError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="celular">Celular / WhatsApp</label>
                        <input type="tel" id="celular" name="celular" class="form-input" placeholder="+51 999 000 000" autocomplete="tel" inputmode="tel" maxlength="20">
                        <span class="field-error" id="celularError" role="alert"></span>
                    </div>
                </div>

                <div class="auth-form-grid">
                    <div class="form-group country-picker-wrap">
                        <label for="pais_search">Pais</label>
                        <input type="hidden" id="pais_id" name="pais_id" value="1">
                        <div class="country-picker" id="countryPicker">
                            <div class="country-picker-field">
                                <span class="country-picker-flag hidden" id="pais_flag" aria-hidden="true"></span>
                                <input
                                    type="text"
                                    id="pais_search"
                                    class="country-picker-input"
                                    placeholder="Buscar pais..."
                                    autocomplete="off"
                                    role="combobox"
                                    aria-expanded="false"
                                    aria-controls="pais_listbox"
                                    aria-autocomplete="list"
                                >
                            </div>
                            <ul class="country-picker-list hidden" id="pais_listbox" role="listbox"></ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="restricciones_medicas">Restricciones medicas</label>
                        <input type="text" id="restricciones_medicas" name="restricciones_medicas" class="form-input" placeholder="Opcional">
                    </div>
                </div>

                <div class="auth-form-grid">
                    <div class="form-group">
                        <label for="password">Contrasena <span class="label-required" aria-hidden="true">*</span></label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" class="form-input" placeholder="Minimo 6 caracteres" autocomplete="new-password" minlength="6" required>
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contrasena" aria-pressed="false">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" id="passwordError" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar contrasena <span class="label-required" aria-hidden="true">*</span></label>
                        <div class="password-field">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Repite tu contrasena" autocomplete="new-password" minlength="6" required>
                            <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Mostrar contrasena" aria-pressed="false">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" id="confirmPasswordError" role="alert"></span>
                    </div>
                </div>

                <label class="auth-checkbox">
                    <input type="checkbox" id="politica" name="politica" required>
                    <span>Acepto el tratamiento de mis datos personales conforme a la Ley 29733 (politica de privacidad). <span class="label-required" aria-hidden="true">*</span></span>
                </label>
                <span class="field-error" id="politicaError" role="alert"></span>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Crear cuenta</button>
            </form>

            <p class="auth-footer">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesion</a>
            </p>
        </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/schema.js"></script>
    <script src="../js/paises.js"></script>
    <script src="../js/turista-validacion.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
