<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Turi Tours</title>
    <meta name="description" content="Accede a tu cuenta de turista en Turi Tours">
    <link rel="stylesheet" href="../css/styles.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <header class="header header-auth">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <img src="../assets/turitours_logo.webp" alt="Turi Tours" class="logo-img" width="160" height="48">
            </a>
            <a href="registro.html" class="btn btn-outline btn-sm auth-header-link">Crear cuenta</a>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Bienvenido de nuevo</h1>
                <p>Inicia sesion para reservar tours y gestionar tus reservas.</p>
            </div>

            <div class="auth-demo-hint">
                <span>Cuenta demo</span>
                <code>paula@example.com</code>
                <span class="auth-demo-sep">/</span>
                <code>demo1234</code>
            </div>

            <form id="loginForm" class="auth-form" autocomplete="on">
                <div class="form-group">
                    <label for="email">Correo electronico <span class="label-required" aria-hidden="true">*</span></label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        inputmode="email"
                        spellcheck="false"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contrasena <span class="label-required" aria-hidden="true">*</span></label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Escribe tu contrasena"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Mostrar contrasena"
                            aria-pressed="false"
                        >
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Iniciar sesion</button>
            </form>

            <p class="auth-footer">
                ¿No tienes cuenta? <a href="registro.html">Registrate aqui</a>
            </p>
        </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/schema.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
