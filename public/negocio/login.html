<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — TuriTours Panel</title>
    <meta name="description" content="Acceso al panel de gestión interna de TuriTours — Sistema de gestión turística de Tarapoto.">
    <link rel="stylesheet" href="../css/admin.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style id="responsive-inline">

        transform: translateX(-100%) !important;
    }
    .admin-sidebar.open {
        transform: translateX(0) !important;
    }
    .sidebar-overlay.open {
        display: block !important;
    }
    .admin-main {
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100vw !important;
    }
    .menu-toggle-admin {
        display: flex !important;
    }
}
@media (max-width: 768px) {
    .admin-header {
        padding: 0 0.75rem !important;
        min-height: 56px;
    }
    .admin-header-title {
        font-size: 1rem !important;
    }
    .admin-header-subtitle {
        font-size: 0.75rem !important;
    }
    .admin-content {
        padding: 0.75rem !important;
    }
    .stats-grid {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .dashboard-grid {

    }
    .a-toolbar {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 0.5rem !important;
    }
    .a-toolbar .a-btn {
        width: 100% !important;
        justify-content: center !important;
    }
    .a-search-input {
        max-width: none !important;
        width: 100% !important;
    }
    .a-table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
        width: 100% !important;
    }
    .a-table {
        min-width: 600px;
    }
    .a-table th,
    .a-table td {
        padding: 0.5rem 0.75rem !important;
        font-size: 0.8125rem !important;
        white-space: nowrap;
    }
    .a-form-row,
    .a-grid-cols-2,
    .a-grid-cols-3 {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .a-modal {
        width: 95vw !important;
        max-width: 95vw !important;
        margin: 0.5rem !important;
        max-height: 90vh !important;
        overflow-y: auto !important;
    }
    .a-modal-body {
        padding: 1rem !important;
    }
    .a-modal-footer {
        flex-direction: column !important;
        gap: 0.5rem;
    }
    .a-modal-footer .a-btn {
        width: 100% !important;
        justify-content: center !important;
    }
    .a-tabs-list {
        flex-wrap: wrap !important;
        gap: 0.25rem !important;
    }
    .a-tab {
        flex: 1 1 auto !important;
        text-align: center !important;
        font-size: 0.8125rem !important;
        padding: 0.5rem 0.25rem !important;
    }
    .a-card-header {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 0.5rem;
    }
    .quick-actions {

        height: 200px !important;

}
@media (max-width: 480px) {
    .admin-header-title {
        font-size: 0.875rem !important;
    }
    .stat-value {
        font-size: 1.25rem !important;

    }

</style>

</head>
<body class="admin-body">

    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-brand-icon" style="background:transparent; box-shadow:none;">
                    <img src="../assets/turitours_logo.webp" alt="TuriTours Logo" style="width:100%;height:100%;object-fit:contain;">
                </div>
                <h1>TuriTours</h1>
                <p>Panel de Gestión Interna</p>
            </div>

            <div class="login-error" id="loginError"></div>

            <form id="loginForm" autocomplete="off">
                <div class="a-form-group">
                    <label class="a-form-label" for="loginEmail">Correo electrónico</label>
                    <input type="email" id="loginEmail" class="a-form-input" placeholder="tu@agencia.com" required autofocus>
                </div>

                <div class="a-form-group">
                    <label class="a-form-label" for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" class="a-form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="a-btn a-btn-primary a-btn-lg a-btn-block" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p style="margin-bottom: 0.75rem">
                    <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
                </p>
                <p style="border-top: 1px solid var(--a-border); padding-top: 0.75rem; font-size: 0.6875rem; color: var(--a-text-muted);">
                    <strong>Cuentas demo:</strong><br>
                    admin@agencia.com / admin123<br>
                    vendedor@agencia.com / venta123<br>
                    guia@agencia.com / guia123
                </p>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/schema.js"></script>
    <script src="../js/admin-data.js"></script>
    <script src="../js/admin-api.js"></script>

    <script>
        // Si ya esta autenticado, redirigir al dashboard
        if (AdminAPI.isAdminAuth()) {
            window.location.replace('index.html');
        }

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Ingresando...';

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                await AdminAPI.login(email, password);
                window.location.href = 'index.html';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });

        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Funcion disponible cuando se implemente el backend Java. Por ahora usa las credenciales demo.');
        });
    </script>
</body>
</html>
