<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Tours — TuriTours</title>
    <link rel="stylesheet" href="../css/admin.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--a-border);
            border-top: none;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .autocomplete-item:hover {
            background: var(--a-bg);
        }
        .tour-img-preview {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--a-border);
            margin-top: 8px;
            display: none;
        }
        .tour-row-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 12px;
            display: inline-block;
            vertical-align: middle;
        }
    </style>

<style id="responsive-inline">
/* ===== RESPONSIVE INLINE — NEGOCIO ===== */
@media (max-width: 1023px) {
    .admin-layout {
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
    }
    .admin-sidebar {
        transform: translateX(-100%) !important;
    }
    .admin-sidebar.open {
        transform: translateX(0) !important;
    }
    .sidebar-overlay.open {
        display: block !important;
    }
    .admin-main {
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100vw !important;
    }
    .menu-toggle-admin {
        display: flex !important;
    }
}
@media (max-width: 768px) {
    .admin-header {
        padding: 0 0.75rem !important;
        min-height: 56px;
    }
    .admin-header-title {
        font-size: 1rem !important;
    }
    .admin-header-subtitle {
        font-size: 0.75rem !important;
    }
    .admin-content {
        padding: 0.75rem !important;
    }
    .stats-grid {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .dashboard-grid {
        grid-template-columns: 1fr !important;
    }
    .a-toolbar {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 0.5rem !important;
    }
    .a-toolbar .a-btn {
        width: 100% !important;
        justify-content: center !important;
    }
    .a-search-input {
        max-width: none !important;
        width: 100% !important;
    }
    .a-table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
        width: 100% !important;
    }
    .a-table {
        min-width: 600px;
    }
    .a-table th,
    .a-table td {
        padding: 0.5rem 0.75rem !important;
        font-size: 0.8125rem !important;
        white-space: nowrap;
    }
    .a-form-row,
    .a-grid-cols-2,
    .a-grid-cols-3 {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .a-modal {
        width: 95vw !important;
        max-width: 95vw !important;
        margin: 0.5rem !important;
        max-height: 90vh !important;
        overflow-y: auto !important;
    }
    .a-modal-body {
        padding: 1rem !important;
    }
    .a-modal-footer {
        flex-direction: column !important;
        gap: 0.5rem;
    }
    .a-modal-footer .a-btn {
        width: 100% !important;
        justify-content: center !important;
    }
    .a-tabs-list {
        flex-wrap: wrap !important;
        gap: 0.25rem !important;
    }
    .a-tab {
        flex: 1 1 auto !important;
        text-align: center !important;
        font-size: 0.8125rem !important;
        padding: 0.5rem 0.25rem !important;
    }
    .a-card-header {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 0.5rem;
    }
    .quick-actions {
        grid-template-columns: 1fr !important;
    }
    .chart-container {
        min-height: 200px !important;
        height: 200px !important;
    }
}
@media (max-width: 480px) {
    .admin-header-title {
        font-size: 0.875rem !important;
    }
    .stat-value {
        font-size: 1.25rem !important;
    }
    .a-table {
        min-width: 500px;
    }
}
</style>

</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header-left">
                    <button class="menu-toggle-admin" id="menuToggleAdmin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div>
                        <h1 class="admin-header-title">Catálogo de Tours</h1>
                        <p class="admin-header-subtitle">Gestión de productos turísticos, precios y cupos</p>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <div class="a-toolbar">
                    <input type="text" class="a-search-input" placeholder="Buscar tour o destino..." onkeyup="filtrarTours(this.value)">
                    <div style="display:flex; gap:0.5rem">
                        <button class="a-btn a-btn-outline" onclick="abrirModalCategorias()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            Categorías
                        </button>
                        <button class="a-btn a-btn-primary" onclick="abrirModalTour()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Crear Tour
                        </button>
                    </div>
                </div>

                <div class="a-table-wrap">
                    <table class="a-table" id="tablaTours">
                        <thead>
                            <tr>
                                <th>Nombre del Tour</th>
                                <th>Destino y Categoría</th>
                                <th>Tarifas (S/)</th>
                                <th>Logística</th>
                                <th>Estado</th>
                                <th style="text-align: right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="6" style="text-align:center">Cargando tours...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Tour -->
    <div class="a-modal-overlay" id="modalTour">
        <div class="a-modal a-modal-lg">
            <div class="a-modal-header">
                <h3 class="a-modal-title">Registrar Tour</h3>
                <button class="a-modal-close" onclick="AdminApp.closeModal('modalTour')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="a-modal-body">
                <form id="formTour" onsubmit="guardarTour(event)">
                    <input type="hidden" id="tourId" value="">
                    
                    <h4 style="margin: 0 0 1rem 0; font-size: 1rem; color: var(--a-text-light);">Información General</h4>
                    <div class="a-form-group">
                        <label class="a-form-label">Nombre del Tour</label>
                        <input type="text" class="a-form-input" id="tourNombre" required placeholder="Ej: Laguna Azul Full Day">
                    </div>

                    <div class="a-form-group a-grid-cols-2">
                        <div>
                            <label class="a-form-label">Destino Principal (Buscador Global)</label>
                            <div style="position:relative;">
                                <input type="text" class="a-form-input" id="tourDestino" required placeholder="Ej: Cusco, Perú" autocomplete="off" oninput="debounceBuscarDestino(this.value)">
                                <div id="destinoSugerencias" class="autocomplete-list" style="display:none;"></div>
                            </div>
                            <input type="hidden" id="tourDestinoLat" value="">
                            <input type="hidden" id="tourDestinoLon" value="">
                        </div>
                        <div>
                            <label class="a-form-label">Categoría</label>
                            <select class="a-form-input" id="tourCategoria" required>
                                <!-- Llenado por JS -->
                            </select>
                        </div>
                    </div>
                    
                    <div class="a-form-group">
                        <label class="a-form-label">Descripción Atractiva</label>
                        <textarea class="a-form-input" id="tourDescripcion" rows="3" required></textarea>
                    </div>

                    <div class="a-form-group">
                        <label class="a-form-label">Fotografías del Tour (Máx 4)</label>
                        <input type="file" class="a-form-input" id="tourImagenFile" accept="image/*" multiple onchange="previewImages(event)">
                        <div id="tourImagenesGaleria" style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;"></div>
                    </div>

                    <div style="border-top: 1px solid var(--a-border); margin: 1.5rem 0; padding-top: 1.5rem;">
                        <h4 style="margin: 0 0 1rem 0; font-size: 1rem; color: var(--a-text-light);">Comercial y Logística</h4>
                        
                        <div class="a-form-group a-grid-cols-4">
                            <div>
                                <label class="a-form-label">Precio Nacional</label>
                                <input type="number" step="0.01" class="a-form-input" id="tourPrecioNac" required min="0" max="99999">
                            </div>
                            <div>
                                <label class="a-form-label">Precio Extranjero</label>
                                <input type="number" step="0.01" class="a-form-input" id="tourPrecioExt" required min="0" max="99999">
                            </div>
                            <div>
                                <label class="a-form-label">Cupo Máximo</label>
                                <input type="number" class="a-form-input" id="tourCupo" required min="1" max="1000">
                            </div>
                            <div>
                                <label class="a-form-label">Duración (Horas)</label>
                                <input type="number" class="a-form-input" id="tourDuracion" required min="1" max="72">
                            </div>
                        </div>

                        <div class="a-form-group a-grid-cols-2">
                            <div>
                                <label class="a-form-label">Estado</label>
                                <select class="a-form-input" id="tourEstado">
                                    <option value="activo">Activo (Visible en Catálogo)</option>
                                    <option value="inactivo">Inactivo (Oculto)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="a-modal-footer">
                <button type="button" class="a-btn a-btn-outline" onclick="AdminApp.closeModal('modalTour')">Cancelar</button>
                <button type="submit" form="formTour" class="a-btn a-btn-primary">Guardar Tour</button>
            </div>
        </div>
    </div>

    <!-- Modal Categorías -->
    <div class="a-modal-overlay" id="modalCategorias">
        <div class="a-modal">
            <div class="a-modal-header">
                <h3 class="a-modal-title">Gestión de Categorías</h3>
                <button class="a-modal-close" onclick="AdminApp.closeModal('modalCategorias')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="a-modal-body">
                <div class="a-table-wrap" style="margin-bottom: 1.5rem">
                    <table class="a-table" id="tablaCategorias">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th style="text-align:right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="2" style="text-align:center">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>

                <h4 style="margin: 0 0 1rem 0; font-size: 1rem; color: var(--a-text-light);" id="tituloFormCategoria">Nueva Categoría</h4>
                <form id="formCategoria" onsubmit="guardarCategoria(event)">
                    <input type="hidden" id="categoriaId" value="">
                    <div class="a-form-group">
                        <label class="a-form-label">Nombre de Categoría <span style="color:var(--a-danger)">*</span></label>
                        <input type="text" class="a-form-input" id="catNombre" required>
                    </div>
                    <div class="a-form-group">
                        <label class="a-form-label">Descripción</label>
                        <input type="text" class="a-form-input" id="catDescripcion">
                    </div>
                    <div class="a-form-group">
                        <label class="a-form-label">Ícono SVG</label>
                        <input type="hidden" id="catIconoSvg" value="">
                        <div id="iconSelector" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 0.5rem; margin-top: 0.5rem;">
                            <!-- Opciones generadas por JS -->
                        </div>
                    </div>
                    <div style="display:flex; justify-content:flex-end; gap:0.5rem">
                        <button type="button" class="a-btn a-btn-outline" onclick="limpiarFormCategoria()" style="display:none" id="btnCancelarEdicionCat">Cancelar Edición</button>
                        <button type="submit" class="a-btn a-btn-primary" id="btnGuardarCat">Crear Categoría</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/schema.js"></script>
    <script src="../js/admin-data.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/admin-app.js"></script>

        const normalizeSvgForMatch = (svg) => {
            return (svg || '').replace(/[\s"']/g, '').toLowerCase();
        };

        function renderIconSelector() {
            const container = document.getElementById('iconSelector');
            container.innerHTML = '';
            for (const [key, svg] of Object.entries(iconosPredefinidos)) {
                const div = document.createElement('div');
                div.innerHTML = svg;
                div.style.padding = '8px';
                div.style.border = '1px solid var(--border, #e5e5e5)';
                div.style.borderRadius = '6px';
                div.style.cursor = 'pointer';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'center';
                div.style.color = 'var(--foreground, #1a1a1a)';
                div.dataset.svg = svg;
                div.dataset.key = key;
                
                div.onclick = () => {
                    document.getElementById('catIconoSvg').value = svg;
                    actualizarIconosVisuales();
                };
                container.appendChild(div);
            }
        }

        function actualizarIconosVisuales() {
            const currentSvg = normalizeSvgForMatch(document.getElementById('catIconoSvg').value);
            const container = document.getElementById('iconSelector');
            let matched = false;
            
            Array.from(container.children).forEach(c => {
                const cSvg = normalizeSvgForMatch(c.dataset.svg);
                if (cSvg === currentSvg && currentSvg !== '') {
                    c.style.borderColor = 'var(--primary, #16a34a)';
                    c.style.background = 'var(--primary-50, #f0fdf4)';
                    c.style.color = 'var(--primary, #16a34a)';
                    matched = true;
                } else {
                    c.style.borderColor = 'var(--border, #e5e5e5)';
                    c.style.background = 'transparent';
                    c.style.color = 'var(--foreground, #1a1a1a)';
                }
            });
            
            // Si el SVG que viene de BD no coincide con ninguno, pero hay un value, 
            // no estallará, simplemente no seleccionará nada. 
            // Opcionalmente podríamos añadirlo al final de la lista.
        }

        document.addEventListener('DOMContentLoaded', async () => {
            AdminApp.init();
            AdminApp.renderSidebar('tours');
            AdminApp.initModalCloseButtons();
            
            renderIconSelector();
            
            await cargarDatosMaestros();
            await cargarTours();
        });

        async function cargarDatosMaestros() {
            try {
                const [destinos, categorias] = await Promise.all([
                    AdminAPI.getDestinos(),
                    AdminAPI.getCategoriasTour()
                ]);

                destinos.forEach(d => {
                    destinosMap[d.id] = d.nombre;
                });

                const selCat = document.getElementById('tourCategoria');
                categorias.forEach(c => {
                    categoriasMap[c.id] = c.nombre;
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nombre;
                    selCat.appendChild(opt);
                });
            } catch (err) {
                console.error("Error al cargar maestros", err);
            }
        }

        async function cargarTours() {
            try {
                allTours = await AdminAPI.getTours();
                renderTours(allTours);
            } catch (err) {
                AdminApp.toast(err.message, 'error');
            }
        }

        function renderTours(lista) {
            const tbody = document.querySelector('#tablaTours tbody');
            if (!lista.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--a-text-light);">No hay tours registrados.</td></tr>';
                return;
            }

            tbody.innerHTML = lista.map(t => {
                let badgeState = 'gray';
                let stateLabel = t.estado.toUpperCase();
                if (t.estado === 'activo') badgeState = 'green';
                if (t.estado === 'inactivo') badgeState = 'red';
                
                let imgUrl = '';
                if (t.imagenes && t.imagenes.length > 0) {
                    imgUrl = t.imagenes[0];
                } else if (t.imagen) { // compatibilidad con registros antiguos
                    imgUrl = t.imagen;
                }
                
                let imgTag = imgUrl ? `<img src="${imgUrl}" class="tour-row-img">` : `<div class="tour-row-img" style="background:var(--a-bg);display:inline-flex;align-items:center;justify-content:center;color:#aaa;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;

                return `<tr>
                    <td style="font-weight:500;">
                        ${imgTag}
                        <span style="display:inline-block;vertical-align:middle;max-width:200px;white-space:normal;">${t.nombre}</span>
                    </td>
                    <td>
                        <div style="font-weight:500;">${t.destino_nombre || destinosMap[t.destino_id] || '-'}</div>
                        <div style="font-size:0.75rem;color:var(--a-text-light)">${t.categoria_nombre || categoriasMap[t.categoria_id] || '-'}</div>
                    </td>
                    <td>
                        <div style="font-size:0.875rem;">Nac: S/ ${t.precio_nacional}</div>
                        <div style="font-size:0.875rem;color:var(--a-text-light)">Ext: S/ ${t.precio_extranjero}</div>
                    </td>
                    <td>
                        <div style="font-size:0.875rem;"><svg style="width:14px;height:14px;vertical-align:middle;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> ${t.cupo_maximo} cupos</div>
                        <div style="font-size:0.875rem;color:var(--a-text-light)"><svg style="width:14px;height:14px;vertical-align:middle;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${t.duracion_horas}h</div>
                    </td>
                    <td><span class="a-badge a-badge-${badgeState}">${stateLabel}</span></td>
                    <td style="text-align: right">
                        <button class="a-btn a-btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; margin-right: 0.25rem;" onclick="abrirModalTour(${t.id})" title="Editar Tour">
                            <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="a-btn a-btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; color: var(--a-danger); border-color: var(--a-danger);" onclick="eliminarTour(${t.id})" title="Eliminar Tour">
                            <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        </button>

        function filtrarTours(q) {
            const ql = q.toLowerCase();
            const filt = allTours.filter(t => 
                (t.nombre && t.nombre.toLowerCase().includes(ql)) ||
                (t.destino_nombre && t.destino_nombre.toLowerCase().includes(ql)) ||
                (destinosMap[t.destino_id] && destinosMap[t.destino_id].toLowerCase().includes(ql))
            );
            renderTours(filt);
        }

        let tourImagenesGlobal = [];

        function abrirModalTour(id = null) {
            document.getElementById('formTour').reset();
            document.getElementById('tourId').value = id || '';
            document.getElementById('tourDestinoLat').value = '';
            document.getElementById('tourDestinoLon').value = '';
            tourImagenesGlobal = [];
            renderGaleria();
            document.getElementById('destinoSugerencias').style.display = 'none';

            const titulo = document.querySelector('#modalTour .a-modal-title');
            
            if (id) {
                const tur = allTours.find(t => t.id === id);
                if (!tur) return;
                titulo.textContent = 'Editar Tour';
                document.getElementById('tourNombre').value = tur.nombre;
                document.getElementById('tourDestino').value = tur.destino_nombre || destinosMap[tur.destino_id] || '';
                document.getElementById('tourCategoria').value = tur.categoria_id;
                document.getElementById('tourDescripcion').value = tur.descripcion || '';
                document.getElementById('tourPrecioNac').value = tur.precio_nacional;
                document.getElementById('tourPrecioExt').value = tur.precio_extranjero;
                document.getElementById('tourCupo').value = tur.cupo_maximo;
                document.getElementById('tourDuracion').value = tur.duracion_horas;
                document.getElementById('tourEstado').value = tur.estado;
                if (tur.imagenes && tur.imagenes.length > 0) {
                    tourImagenesGlobal = [...tur.imagenes];
                } else if (tur.imagen) {
                    tourImagenesGlobal = [tur.imagen];
                }
                renderGaleria();
            } else {
                titulo.textContent = 'Registrar Nuevo Tour';
                document.getElementById('tourEstado').value = 'activo';
            }
            AdminApp.openModal('modalTour');
        }

        async function guardarTour(e) {
            e.preventDefault();
            const form = document.getElementById('formTour');
            const btn = form.closest('.a-modal').querySelector('.a-btn-primary');
            btn.disabled = true;

            const id = document.getElementById('tourId').value;
            const destNombre = document.getElementById('tourDestino').value;
            const destLat = document.getElementById('tourDestinoLat').value;
            const destLon = document.getElementById('tourDestinoLon').value;

            try {
                // Registrar o buscar destino para obtener el ID
                const destino_id = await AdminAPI.buscarOCrearDestino(destNombre, parseFloat(destLat)||0, parseFloat(destLon)||0);

                const datos = {
                    nombre: document.getElementById('tourNombre').value,
                    destino_id: destino_id,
                    categoria_id: parseInt(document.getElementById('tourCategoria').value),
                    descripcion: document.getElementById('tourDescripcion').value,
                    precio_nacional: parseFloat(document.getElementById('tourPrecioNac').value),
                    precio_extranjero: parseFloat(document.getElementById('tourPrecioExt').value),
                    cupo_maximo: parseInt(document.getElementById('tourCupo').value),
                    duracion_horas: parseInt(document.getElementById('tourDuracion').value),
                    estado: document.getElementById('tourEstado').value,
                    imagenes: tourImagenesGlobal
                };

                if (id) {
                    await AdminAPI.actualizarTour(parseInt(id), datos);
                    AdminApp.toast('Tour actualizado correctamente', 'success');
                } else {
                    await AdminAPI.crearTour(datos);
                    AdminApp.toast('Tour creado correctamente', 'success');
                }
                AdminApp.closeModal('modalTour');
                cargarDatosMaestros();
                cargarTours();
            } catch (err) {
                AdminApp.toast(err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        /* --- COMPRESOR DE IMAGEN (MULTIPLE) --- */
        function previewImages(event) {
            const files = event.target.files;
            if (!files.length) return;
            
            // Límite de 4 imágenes
            const totalActuales = tourImagenesGlobal.length;
            const faltantesPara4 = 4 - totalActuales;
            
            if (faltantesPara4 <= 0) {
                AdminApp.toast('Máximo 4 imágenes permitidas', 'warning');
                return;
            }

            const procesar = Math.min(files.length, faltantesPara4);
            
            for(let i=0; i<procesar; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Max dimension 800px
                        if (width > 800 || height > 800) {
                            if (width > height) {
                                height = Math.round((height *= 800 / width));
                                width = 800;
                            } else {
                                width = Math.round((width *= 800 / height));
                                height = 800;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        tourImagenesGlobal.push(dataUrl);
                        renderGaleria();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(files[i]);
            }
        }

        function renderGaleria() {
            const container = document.getElementById('tourImagenesGaleria');
            container.innerHTML = '';
            tourImagenesGlobal.forEach((b64, idx) => {
                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';
                wrapper.style.width = '80px';
                wrapper.style.height = '80px';
                
                const img = document.createElement('img');
                img.src = b64;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '6px';
                img.style.border = '1px solid var(--a-border)';
                
                const btnRemove = document.createElement('button');
                btnRemove.innerHTML = '×';
                btnRemove.style.position = 'absolute';
                btnRemove.style.top = '-5px';
                btnRemove.style.right = '-5px';
                btnRemove.style.background = '#e74c3c';
                btnRemove.style.color = '#fff';
                btnRemove.style.border = 'none';
                btnRemove.style.borderRadius = '50%';
                btnRemove.style.width = '20px';
                btnRemove.style.height = '20px';
                btnRemove.style.cursor = 'pointer';
                btnRemove.style.fontSize = '14px';
                btnRemove.style.lineHeight = '20px';
                btnRemove.style.padding = '0';
                
                btnRemove.onclick = (ev) => {
                    ev.preventDefault();
                    tourImagenesGlobal.splice(idx, 1);
                    renderGaleria();
                };
                
                wrapper.appendChild(img);
                wrapper.appendChild(btnRemove);
                container.appendChild(wrapper);
            });
        }

        /* --- BUSCADOR NOMINATIM --- */
        let debounceTimer;
        function debounceBuscarDestino(query) {
            clearTimeout(debounceTimer);
            if (query.length < 3) {
                document.getElementById('destinoSugerencias').style.display = 'none';
                return;
            }
            debounceTimer = setTimeout(() => buscarNominatim(query), 600);
        }

        async function buscarNominatim(query) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                const sugs = document.getElementById('destinoSugerencias');
                sugs.innerHTML = '';
                
                if (data.length > 0) {
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.textContent = item.display_name;
                        div.onclick = () => {
                            document.getElementById('tourDestino').value = item.display_name.split(',')[0].trim() + ', ' + item.display_name.split(',').pop().trim();
                            document.getElementById('tourDestinoLat').value = item.lat;
                            document.getElementById('tourDestinoLon').value = item.lon;
                            sugs.style.display = 'none';
                        };
                        sugs.appendChild(div);
                    });
                    sugs.style.display = 'block';
                } else {
                    sugs.style.display = 'none';
                }
            } catch (e) {
                console.error(e);
            }
        }

            if (!confirm('¿Estás seguro de que deseas eliminar este tour? Esta acción no se puede deshacer.')) return;
            try {
                await AdminAPI.eliminarTour(id);
                AdminApp.toast('Tour eliminado correctamente', 'success');
                cargarTours();
            } catch (err) {
                AdminApp.toast(err.message, 'error');
            }
        }

                            <td>${c.nombre}</td>
                            <td style="text-align:right">
                                <button class="a-btn a-btn-sm a-btn-outline" onclick="editarCategoria(${c.id})">Editar</button>
                                <button class="a-btn a-btn-sm a-btn-danger" onclick="eliminarCategoria(${c.id})">Eliminar</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:red">${error.message}</td></tr>`;
            }
        }

        function abrirModalCategorias() {
            AdminApp.openModal('modalCategorias');
            cargarCategoriasModal();
            limpiarFormCategoria();
        }

        function limpiarFormCategoria() {
            document.getElementById('categoriaId').value = '';
            document.getElementById('catNombre').value = '';
            document.getElementById('catDescripcion').value = '';
            document.getElementById('catIconoSvg').value = '';
            actualizarIconosVisuales();
            document.getElementById('tituloFormCategoria').textContent = 'Nueva Categoría';
            document.getElementById('btnGuardarCat').textContent = 'Crear Categoría';
            document.getElementById('btnCancelarEdicionCat').style.display = 'none';
        }

        function editarCategoria(id) {
            const cat = categoriasLocales.find(c => c.id === id);
            if (!cat) return;
            document.getElementById('categoriaId').value = cat.id;
            document.getElementById('catNombre').value = cat.nombre;
            document.getElementById('catDescripcion').value = cat.descripcion || '';
            document.getElementById('catIconoSvg').value = cat.icono_svg || '';
            actualizarIconosVisuales();
            document.getElementById('tituloFormCategoria').textContent = 'Editar Categoría';
            document.getElementById('btnGuardarCat').textContent = 'Guardar Cambios';
            document.getElementById('btnCancelarEdicionCat').style.display = 'inline-flex';
        }

        async function guardarCategoria(e) {
            e.preventDefault();
            const id = document.getElementById('categoriaId').value;
            const datos = {
                nombre: document.getElementById('catNombre').value.trim(),
                descripcion: document.getElementById('catDescripcion').value.trim(),
                icono_svg: document.getElementById('catIconoSvg').value.trim()
            };

            const btn = document.getElementById('btnGuardarCat');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                if (id) {
                    await AdminAPI.editarCategoriaTour(id, datos);
                    AdminApp.toast('Categoría actualizada', 'success');
                } else {
                    await AdminAPI.crearCategoriaTour(datos);
                    AdminApp.toast('Categoría creada', 'success');
                }
                limpiarFormCategoria();
                cargarCategoriasModal();
                cargarTours(); // Para actualizar el select de categorias
            } catch (error) {
                AdminApp.toast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = id ? 'Guardar Cambios' : 'Crear Categoría';
            }
        }

        async function eliminarCategoria(id) {
            if (!confirm('¿Seguro que deseas eliminar esta categoría? No podrás si hay tours usando esta categoría.')) return;
            try {
                await AdminAPI.eliminarCategoriaTour(id);
                AdminApp.toast('Categoría eliminada', 'success');
                cargarCategoriasModal();
                cargarTours();
            } catch (error) {
                AdminApp.toast(error.message, 'error');
            }
        }
    </script>
</body>
</html>
