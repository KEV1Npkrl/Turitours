<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia — TuriTours (Modo Guía)</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- html5-qrcode for scanning -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .qr-reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .passenger-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .passenger-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--a-border-color);
        }
        .passenger-item:last-child {
            border-bottom: none;
        }
        .checkbox-large {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        .asistencia-container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="admin-layout" style="display: none;">
    <div class="admin-wrapper">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-brand">
                <h2>TuriTours <span style="font-size: 0.75rem; color: var(--a-text-muted);">GUÍAS</span></h2>
            </div>
            <nav class="admin-nav" id="adminNav">
                <a href="asistencia.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Asistencia y Equipos
                </a>
                <a href="#" onclick="AdminApp.logout()" class="nav-item text-red-500">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </a>
            </nav>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header-left">
                    <button class="menu-toggle-admin" id="menuToggleAdmin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div>
                        <h1 class="admin-header-title">Control de Asistencia</h1>
                        <p class="admin-header-subtitle">Guías y Coordinadores</p>
                    </div>
                </div>
            </header>

            <div class="admin-content asistencia-container">
                <div class="a-tabs" style="margin-bottom: 1rem;">
                    <div class="a-tabs-list">
                        <button class="a-tab active" onclick="cambiarTab('asistencia')" id="tab-btn-asistencia">Asistencia QR</button>
                        <button class="a-tab" onclick="cambiarTab('equipos')" id="tab-btn-equipos">Equipos / Insumos</button>
                    </div>
                </div>

                <!-- Tab Asistencia QR -->
                <div id="tab-asistencia" class="tab-pane active">
                    <div class="dashboard-card" style="margin-bottom: 1rem;">
                        <div class="card-header">
                            <h2 class="card-title">Escanear Ticket QR</h2>
                        </div>
                        <div class="card-body" style="text-align: center;">
                            <div id="qr-reader" class="qr-reader"></div>
                            <div id="qr-reader-results" style="margin-top: 1rem; color: var(--a-primary);"></div>
                            <button id="btnStartScan" class="a-btn a-btn-primary" style="margin: 1rem auto; display: inline-flex;" onclick="iniciarEscaner()">Iniciar Cámara</button>
                            <button id="btnStopScan" class="a-btn a-btn-outline" style="margin: 1rem auto; display: none;" onclick="detenerEscaner()">Detener Cámara</button>
                            
                            <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--a-border-color);">
                            
                            <p style="margin-bottom: 0.5rem; font-size: 0.875rem;">¿Problemas con la cámara? Buscar por Reserva manualmente</p>
                            <div class="a-toolbar" style="justify-content: center;">
                                <input type="text" id="manualQrCode" class="a-form-input" placeholder="Ej: QR-RES-12345" style="max-width: 300px;">
                                <button class="a-btn a-btn-outline" onclick="buscarQrManual()">Buscar</button>
                            </div>
                        </div>
                    </div>

                    <!-- Panel de Pasajeros -->
                    <div class="dashboard-card" id="panelPasajeros" style="display: none;">
                        <div class="card-header">
                            <h2 class="card-title">Pasajeros a Validar</h2>
                        </div>
                        <div class="card-body">
                            <p class="a-text-muted" style="margin-bottom: 1rem;">Revise físicamente el DNI de cada persona antes de marcar.</p>
                            <ul class="passenger-list" id="listaPasajeros"></ul>
                            <div style="margin-top: 1rem; text-align: right;">
                                <button class="a-btn a-btn-primary" onclick="guardarAsistencias()">Confirmar Asistencia Seleccionada</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Equipos (Movimientos) -->
                <div id="tab-equipos" class="tab-pane" style="display: none;">
                    <div class="dashboard-card">
                        <div class="card-header">
                            <h2 class="card-title">Retirar Equipos para el Tour</h2>
                        </div>
                        <div class="card-body">
                            <form id="formRetiroEquipos" onsubmit="registrarRetiroEquipo(event)">
                                <div class="a-form-group">
                                    <label class="a-form-label">Equipo a retirar</label>
                                    <select id="retiroEquipoId" class="a-form-input" required></select>
                                </div>
                                <div class="a-form-group">
                                    <label class="a-form-label">Cantidad</label>
                                    <input type="number" id="retiroCantidad" class="a-form-input" required min="1">
                                </div>
                                <div class="a-form-group">
                                    <label class="a-form-label">Tour / Destino (Motivo)</label>
                                    <input type="text" id="retiroMotivo" class="a-form-input" required placeholder="Ej: Laguna Azul">
                                </div>
                                <button type="submit" class="a-btn a-btn-primary">Registrar Retiro</button>
                            </form>
                        </div>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <script src="../js/admin-app.js"></script>
    <script>
        let html5QrcodeScanner = null;
        let qrReaderRef = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!AdminApp.init('asistencia')) return;
            cargarEquipos();
        });

        function cambiarTab(tab) {
            document.querySelectorAll('.a-tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
            document.getElementById('tab-btn-' + tab).classList.add('active');
            document.getElementById('tab-' + tab).style.display = 'block';
        }

        // --- SCANNER QR ---
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('qr-reader-results').innerText = "QR detectado: " + decodedText;
            detenerEscaner();
            procesarQr(decodedText);
        }

        function onScanFailure(error) {
            // handle scan failure, usually better to ignore and keep scanning
        }

        function iniciarEscaner() {
            document.getElementById('btnStartScan').style.display = 'none';
            document.getElementById('btnStopScan').style.display = 'inline-flex';
            
            if(!qrReaderRef) {
                qrReaderRef = new Html5Qrcode("qr-reader");
            }
            qrReaderRef.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: {width: 250, height: 250} },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                AdminApp.toast('Error accediendo a la cámara. Asegúrese de dar permisos.', 'error');
                detenerEscaner();
            });
        }

        function detenerEscaner() {
            if(qrReaderRef) {
                qrReaderRef.stop().then(() => {
                    document.getElementById('btnStartScan').style.display = 'inline-flex';
                    document.getElementById('btnStopScan').style.display = 'none';
                }).catch(err => {
                    console.error("Failed to stop scanner.", err);
                });
            }
        }

        function buscarQrManual() {
            const qr = document.getElementById('manualQrCode').value.trim();
            if(qr) procesarQr(qr);
            else AdminApp.toast('Ingrese un código', 'error');
        }

        async function procesarQr(codigo) {
            try {
                const res = await fetch('http://localhost:3000/api/asistencia/escanear', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('admin_token')}`
                    },
                    body: JSON.stringify({ codigo_qr: codigo })
                });
                const data = await res.json();
                if(res.ok) {
                    renderPasajeros(data.pasajeros);
                } else {
                    AdminApp.toast(data.error || 'Reserva no encontrada', 'error');
                }
            } catch(e) {
                AdminApp.toast('Error de conexión', 'error');
            }
        }

        function renderPasajeros(pasajeros) {
            const ul = document.getElementById('listaPasajeros');
            if(pasajeros.length === 0) {
                ul.innerHTML = '<li>No hay pasajeros</li>';
            } else {
                ul.innerHTML = pasajeros.map(p => `
                    <li class="passenger-item">
                        <div>
                            <strong>${p.nombre}</strong> ${p.es_titular ? '<span class="a-badge a-badge-green">Titular</span>' : ''}<br>
                            <small class="a-text-muted">DNI: ${p.documento}</small>
                        </div>
                        <div>
                            ${p.asistio 
                                ? '<span class="a-badge a-badge-green" style="padding: 0.5rem;">Asistió</span>' 
                                : `<input type="checkbox" class="checkbox-large passenger-checkbox" value="${p.id}">`
                            }
                        </div>
                    </li>
                `).join('');
            }
            document.getElementById('panelPasajeros').style.display = 'block';
        }

        async function guardarAsistencias() {
            const checkboxes = document.querySelectorAll('.passenger-checkbox:checked');
            if(checkboxes.length === 0) {
                AdminApp.toast('Seleccione al menos un pasajero', 'error');
                return;
            }

            const ids = Array.from(checkboxes).map(c => parseInt(c.value));
            
            try {
                const res = await fetch('http://localhost:3000/api/asistencia/marcar', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('admin_token')}`
                    },
                    body: JSON.stringify({ pasajeros_ids: ids })
                });
                const data = await res.json();
                if(res.ok) {
                    AdminApp.toast('Asistencia marcada correctamente', 'success');
                    // Ocultamos el panel para pedir otro escaneo
                    document.getElementById('panelPasajeros').style.display = 'none';
                    document.getElementById('qr-reader-results').innerText = '';
                } else {
                    AdminApp.toast(data.error || 'Error al guardar', 'error');
                }
            } catch(e) {
                AdminApp.toast('Error de conexión', 'error');
            }
        }

        // --- RETIRO DE EQUIPOS ---
        async function cargarEquipos() {
            try {
                const res = await fetch('http://localhost:3000/api/inventario/equipos', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('admin_token')}` }
                });
                const data = await res.json();
                const sel = document.getElementById('retiroEquipoId');
                sel.innerHTML = '<option value="">-- Seleccionar Equipo --</option>' + 
                    data.equipos.map(eq => `<option value="${eq.id}">${eq.nombre} (Disp: ${eq.cantidad_disponible})</option>`).join('');
            } catch(e) {
                console.error(e);
            }
        }

        async function registrarRetiroEquipo(e) {
            e.preventDefault();
            const btn = document.querySelector('#formRetiroEquipos button');
            btn.disabled = true;

            const payload = {
                equipo_id: document.getElementById('retiroEquipoId').value,
                tipo: 'salida',
                cantidad: document.getElementById('retiroCantidad').value,
                motivo: document.getElementById('retiroMotivo').value
            };

            try {
                const res = await fetch('http://localhost:3000/api/inventario/movimientos', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('admin_token')}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(res.ok) {
                    AdminApp.toast('Retiro registrado. Buen viaje.', 'success');
                    document.getElementById('formRetiroEquipos').reset();
                    cargarEquipos(); // Refresh available stock
                } else {
                    AdminApp.toast(data.error || 'Error al registrar retiro', 'error');
                }
            } catch(e) {
                AdminApp.toast('Error de conexión', 'error');
            } finally {
                btn.disabled = false;
            }
        }

    </script>
</body>
</html>
