<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones y Logística — TuriTours</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tour-op-card {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem;
            border-left: 4px solid var(--a-primary);
        }
        .tour-op-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .tour-op-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--a-text);
            margin-bottom: 0.25rem;
        }
        .tour-op-meta {
            font-size: 0.875rem;
            color: var(--a-text-secondary);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .tour-op-meta-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .tour-op-meta-item svg { width: 16px; height: 16px; }
        .tour-op-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--a-border);
        }
        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background: var(--a-surface);
            border: 1px solid var(--a-border);
            border-radius: 6px;
            cursor: pointer;
        }
        .checklist-item:hover {
            border-color: var(--a-primary);
        }
        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--a-primary);
        }
    </style>
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-header-left">
                    <button class="menu-toggle-admin" id="menuToggleAdmin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div>
                        <h1 class="admin-header-title">Operaciones en Campo</h1>
                        <p class="admin-header-subtitle">Tus tours asignados y logística</p>
                    </div>
                </div>
            </header>

            <div class="admin-content">
                <div class="a-tabs">
                    <div class="a-tabs-list">
                        <button class="a-tab active">Tours Asignados</button>
                    </div>
                </div>

                <div id="toursContainer" style="display: flex; flex-direction: column; gap: 1rem;">
                    <div class="a-loading"><div class="a-spinner"></div></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Manifiesto -->
    <div class="a-modal-overlay" id="modalManifiesto">
        <div class="a-modal a-modal-lg">
            <div class="a-modal-header">
                <h3 class="a-modal-title" id="manifiestoTitle">Manifiesto de Pasajeros</h3>
                <button class="a-modal-close" onclick="AdminApp.closeModal('modalManifiesto')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="a-modal-body" style="padding: 0;">
                <div class="a-table-wrap">
                    <table class="a-table" id="tablaManifiesto">
                        <thead>
                            <tr>
                                <th>Pasajero</th>
                                <th>Nacionalidad</th>
                                <th>Hotel (Recojo)</th>
                                <th>Restricciones Médicas</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="a-modal-footer">
                <button type="button" class="a-btn a-btn-outline" onclick="AdminApp.closeModal('modalManifiesto')">Cerrar</button>
                <button type="button" class="a-btn a-btn-primary" onclick="window.print()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    Imprimir
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Checklist -->
    <div class="a-modal-overlay" id="modalChecklist">
        <div class="a-modal">
            <div class="a-modal-header">
                <h3 class="a-modal-title">Checklist Pre-Salida</h3>
                <button class="a-modal-close" onclick="AdminApp.closeModal('modalChecklist')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="a-modal-body">
                <p class="a-text-muted">Por favor, verifica que todos los insumos y condiciones estén listos antes de iniciar el tour.</p>
                <form id="formChecklist">
                    <input type="hidden" id="checkTourId">
                    <input type="hidden" id="checkFecha">
                    <div class="checklist-grid">
                        <label class="checklist-item">
                            <input type="checkbox" name="botiquin" required>
                            <span>Botiquín de Primeros Auxilios</span>
                        </label>
                        <label class="checklist-item">
                            <input type="checkbox" name="chalecos" required>
                            <span>Chalecos / Equipamiento</span>
                        </label>
                        <label class="checklist-item">
                            <input type="checkbox" name="vehiculo" required>
                            <span>Estado del Vehículo OK</span>
                        </label>
                        <label class="checklist-item">
                            <input type="checkbox" name="combustible" required>
                            <span>Combustible al nivel requerido</span>
                        </label>
                        <label class="checklist-item">
                            <input type="checkbox" name="documentos" required>
                            <span>Documentos y Manifiesto</span>
                        </label>
                    </div>
                </form>
            </div>
            <div class="a-modal-footer">
                <button type="button" class="a-btn a-btn-outline" onclick="AdminApp.closeModal('modalChecklist')">Cancelar</button>
                <button type="button" class="a-btn a-btn-primary" onclick="guardarChecklist()">Guardar Checklist</button>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/schema.js"></script>
    <script src="../js/admin-data.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/admin-app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!AdminApp.init('operaciones')) return;
            cargarTours();
        });

        async function cargarTours() {
            const container = document.getElementById('toursContainer');
            try {
                const tours = await AdminAPI.getMisToursOperativos();
                if (tours.length === 0) {
                    container.innerHTML = `<div class="a-empty"><p class="a-empty-title">Sin tours asignados</p><p class="a-empty-text">No tienes salidas programadas próximamente.</p></div>`;
                    return;
                }

                container.innerHTML = tours.map(t => {
                    const esHoy = t.estado === 'hoy';
                    const badge = esHoy ? `<span class="a-badge a-badge-green">Saliendo Hoy</span>` : `<span class="a-badge a-badge-gray">Próximo</span>`;
                    const checkColor = t.checklist_completado ? 'var(--a-success)' : 'var(--a-warning)';
                    const checkText = t.checklist_completado ? 'Checklist OK' : 'Checklist Pendiente';

                    return `
                    <div class="a-card tour-op-card">
                        <div class="tour-op-header">
                            <div>
                                <h3 class="tour-op-title">${t.tour_nombre}</h3>
                                <div class="tour-op-meta">
                                    <div class="tour-op-meta-item">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                        ${AdminApp.formatFecha(t.fecha)} a las ${t.hora_salida}
                                    </div>
                                    <div class="tour-op-meta-item">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                                        ${t.personas} / ${t.cupo_max} Pasajeros
                                    </div>
                                </div>
                            </div>
                            <div>${badge}</div>
                        </div>
                        
                        <div class="tour-op-actions">
                            <button class="a-btn a-btn-outline" onclick="verManifiesto(${t.tour_id}, '${t.fecha}', '${t.tour_nombre}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                Manifiesto
                            </button>
                            <button class="a-btn a-btn-outline" onclick="abrirChecklist(${t.tour_id}, '${t.fecha}')" style="color: ${checkColor}; border-color: ${checkColor}">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                ${checkText}
                            </button>
                        </div>
                    </div>`;
                }).join('');
            } catch (error) {
                container.innerHTML = `<div class="a-empty"><p class="a-empty-title">Error</p><p class="a-empty-text">${error.message}</p></div>`;
            }
        }

        async function verManifiesto(tourId, fecha, tourNombre) {
            document.getElementById('manifiestoTitle').textContent = `Manifiesto: ${tourNombre} (${AdminApp.formatFecha(fecha)})`;
            const tbody = document.querySelector('#tablaManifiesto tbody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">Cargando...</td></tr>';
            AdminApp.openModal('modalManifiesto');

            try {
                const manifiesto = await AdminAPI.getManifiestoTour(tourId, fecha);
                if (manifiesto.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center">No hay pasajeros registrados</td></tr>';
                    return;
                }

                tbody.innerHTML = manifiesto.map(m => {
                    let alertHtml = '';
                    if (m.restricciones_medicas) {
                        alertHtml = `<span class="a-badge a-badge-red" title="${m.restricciones_medicas}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;margin-right:4px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            ${m.restricciones_medicas}
                        </span>`;
                    } else {
                        alertHtml = '<span style="color:var(--a-text-muted)">Ninguna</span>';
                    }

                    return `<tr>
                        <td>
                            <div style="font-weight:600">${m.nombre}</div>
                            <div style="font-size:0.75rem;color:var(--a-text-secondary)">DNI/Pas: ${m.documento} | Tel: ${m.telefono}</div>
                        </td>
                        <td>${m.nacionalidad}</td>
                        <td>${m.hotel_recojo}</td>
                        <td>${alertHtml}</td>
                    </tr>`;
                }).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:red">${err.message}</td></tr>`;
            }
        }

        function abrirChecklist(tourId, fecha) {
            document.getElementById('checkTourId').value = tourId;
            document.getElementById('checkFecha').value = fecha;
            document.getElementById('formChecklist').reset();
            AdminApp.openModal('modalChecklist');
        }

        async function guardarChecklist() {
            const form = document.getElementById('formChecklist');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const tourId = parseInt(document.getElementById('checkTourId').value);
            const fecha = document.getElementById('checkFecha').value;
            const btn = form.closest('.a-modal').querySelector('.a-btn-primary');
            btn.disabled = true;;

            try {
                // mock checklist data
                const data = {
                    botiquin: form.botiquin.checked,
                    chalecos: form.chalecos.checked,
                    vehiculo: form.vehiculo.checked,
                    combustible: form.combustible.checked,
                    documentos: form.documentos.checked
                };
                await AdminAPI.guardarChecklist(tourId, fecha, data);
                AdminApp.toast('Checklist guardado correctamente', 'success');
                AdminApp.closeModal('modalChecklist');
                cargarTours(); // refresh
            } catch (err) {
                AdminApp.toast(err.message, 'error');
            } finally {
                btn.disabled = false;;
            }
        }
    </script>
</body>
</html>
