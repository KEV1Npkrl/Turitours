<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tarapoto Tours</title>
    <meta name="description" content="Crea tu cuenta de turista en Tarapoto Tours">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo"><span>Tarapoto Tours</span></a>
            <nav class="nav-desktop">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="tours.html" class="nav-link">Tours</a>
                <a href="destinos.html" class="nav-link">Destinos</a>
                <a href="nosotros.html" class="nav-link">Nosotros</a>
                <a href="contacto.html" class="nav-link">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 720px;">
            <div class="card" style="padding: 2rem;">
                <h1 class="section-title" style="margin-bottom: 1rem;">Crear cuenta de turista</h1>
                <p style="margin-bottom: 1.5rem; color: var(--muted-foreground);">Datos alineados con la tabla <code>turistas</code> de la BD.</p>
                <form id="registroForm">
                    <div style="display:grid; gap:1rem; grid-template-columns: repeat(auto-fit,minmax(200px,1fr));">
                        <div class="form-group">
                            <label for="tipo_doc">Tipo de documento</label>
                            <select id="tipo_doc" name="tipo_doc" class="filter-select" required>
                                <option value="DNI">DNI</option>
                                <option value="Pasaporte">Pasaporte</option>
                                <option value="CE">CE</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="documento">Numero de documento</label>
                            <input type="text" id="documento" name="documento" class="filter-select" required>
                        </div>
                    </div>
                    <div style="display:grid; gap:1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); margin-top:1rem;">
                        <div class="form-group">
                            <label for="nombre">Nombres</label>
                            <input type="text" id="nombre" name="nombre" class="filter-select" required>
                        </div>
                        <div class="form-group">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" name="apellidos" class="filter-select" required>
                        </div>
                    </div>
                    <div style="display:grid; gap:1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); margin-top:1rem;">
                        <div class="form-group">
                            <label for="email">Correo</label>
                            <input type="email" id="email" name="email" class="filter-select" required>
                        </div>
                        <div class="form-group">
                            <label for="celular">Celular / WhatsApp</label>
                            <input type="tel" id="celular" name="celular" class="filter-select">
                        </div>
                    </div>
                    <div style="display:grid; gap:1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); margin-top:1rem;">
                        <div class="form-group">
                            <label for="pais_id">Pais</label>
                            <select id="pais_id" name="pais_id" class="filter-select" required></select>
                        </div>
                        <div class="form-group">
                            <label for="restricciones_medicas">Restricciones medicas</label>
                            <input type="text" id="restricciones_medicas" name="restricciones_medicas" class="filter-select" placeholder="Opcional">
                        </div>
                    </div>
                    <div style="display:grid; gap:1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); margin-top:1rem;">
                        <div class="form-group">
                            <label for="password">Contrasena</label>
                            <input type="password" id="password" name="password" class="filter-select" minlength="6" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar contrasena</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="filter-select" minlength="6" required>
                        </div>
                    </div>
                    <label style="display:flex; gap:0.5rem; align-items:flex-start; margin-top:1rem; font-size:0.875rem;">
                        <input type="checkbox" id="politica" name="politica" required style="margin-top:0.2rem;">
                        <span>Acepto el tratamiento de mis datos personales conforme a la Ley 29733 (politica de privacidad).</span>
                    </label>
                    <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Registrarme</button>
                </form>
                <p style="margin-top: 1rem;">¿Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/schema.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
