<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tarapoto Tours</title>
    <meta name="description" content="Crea tu cuenta en Tarapoto Tours">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <span>Tarapoto Tours</span>
            </a>
            <nav class="nav-desktop">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="tours.html" class="nav-link">Tours</a>
                <a href="destinos.html" class="nav-link">Destinos</a>
                <a href="nosotros.html" class="nav-link">Nosotros</a>
                <a href="contacto.html" class="nav-link">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container" style="max-width: 720px;">
            <div class="card" style="padding: 2rem;">
                <h1 class="section-title" style="margin-bottom: 1rem;">Crear Cuenta</h1>
                <p class="text-muted-foreground" style="margin-bottom: 1.5rem;">Regístrate para guardar tus reservas y recibir confirmaciones.</p>
                <form>
                    <div style="display:grid; gap: 1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr));">
                        <div>
                            <label class="filter-label" for="nombre">Nombre</label>
                            <input type="text" id="nombre" class="filter-select" placeholder="Tu nombre">
                        </div>
                        <div>
                            <label class="filter-label" for="apellido">Apellido</label>
                            <input type="text" id="apellido" class="filter-select" placeholder="Tu apellido">
                        </div>
                    </div>
                    <div style="display:grid; gap: 1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); margin-top: 1rem;">
                        <div>
                            <label class="filter-label" for="email">Correo</label>
                            <input type="email" id="email" class="filter-select" placeholder="tu@email.com">
                        </div>
                        <div>
                            <label class="filter-label" for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" class="filter-select" placeholder="+51 999 888 777">
                        </div>
                    </div>
                    <div style="display:grid; gap: 1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); margin-top: 1rem;">
                        <div>
                            <label class="filter-label" for="password">Contraseña</label>
                            <input type="password" id="password" class="filter-select" placeholder="Mínimo 6 caracteres">
                        </div>
                        <div>
                            <label class="filter-label" for="confirmPassword">Confirmar contraseña</label>
                            <input type="password" id="confirmPassword" class="filter-select" placeholder="Repite tu contraseña">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Registrarme</button>
                </form>
                <p style="margin-top: 1rem;">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </main>
</body>
</html>
